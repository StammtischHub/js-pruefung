<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Intelligenter Posteingang</title>

    <link rel="stylesheet" href="./src/styles/main.css" />
  </head>

  <body>
    <header>
      <h1>Intelligenter Posteingang</h1>

      <div class="header-actions">
        <div class="document-upload">
          <button class="button" id="upload-button" type="button">PDF hochladen</button>
          <input id="document-upload" type="file" accept=".pdf,application/pdf" hidden />
        </div>
        <nav id="main-nav" aria-label="Hauptnavigation">
          <button class="button" type="button" data-view="inbox">Inbox</button>
          <button class="button" type="button" data-view="review">Zu prüfen</button>
          <button class="button" type="button" data-view="waiting">Warteposition</button>
          <button class="button" type="button" data-view="trash">Papierkorb</button>
        </nav>
      </div>
    </header>

    <p id="upload-status" role="status" aria-live="polite" hidden></p>
    <main id="app"></main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
